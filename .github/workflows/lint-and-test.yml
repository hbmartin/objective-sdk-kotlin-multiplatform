name: Detekt and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  detekt:
    name: Run Detekt and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :objective:detektMetadataMain
      - run: ./gradlew :cli:detektMain
      - run: ./gradlew :objective:apiCheck
      - run: ./gradlew :objective:assemble :cli:assemble
      - run: ./gradlew :objective:jvmTest
        env:
          OBJECTIVE_KEY: ${{ secrets.OBJECTIVE_KEY }}