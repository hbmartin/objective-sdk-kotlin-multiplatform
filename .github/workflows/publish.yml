name: Publish package to the Maven Central Repository
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: macos-12
    if: github.repository == 'hbmartin/objective-sdk-kotlin-multiplatform'
    steps:
      - uses: actions/checkout@v4
        with:
          path: objective-sdk-kotlin-multiplatform
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish Library
        run: |
          cd objective-sdk-kotlin-multiplatform
          ./gradlew :objective:assemble :objective:publishAndReleaseToMavenCentral :objective:updatePackageSwift --no-configuration-cache --no-parallel
          ./gradlew :cli:assemble :cli:publishAndReleaseToMavenCentral --no-configuration-cache --no-parallel
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      - name: Checkout homebrew repo
        uses: actions/checkout@v4
        with:
          repository: hbmartin/homebrew-objective
          token: ${{ secrets.PAT_HOMEBREW_OBJECTIVE }}
          path: homebrew-objective
      - name: Commit and push to homebrew repo
        run: |
          cd homebrew-objective
          cp ../objective-sdk-kotlin-multiplatform/cli/build/Formula/objective.rb Formula/objective.rb
          git config user.name hbmartin[bot]
          git config user.email harold.martin@gmail.com
          git add Formula/objective.rb
          git commit -m "Update homebrew-objective to ${{ github.event.release.tag_name }}"
          git push origin head
      - name: Checkout SPM repo
        uses: actions/checkout@v4
        with:
          repository: hbmartin/objective-sdk-ios
          token: ${{ secrets.PAT_SPM_OBJECTIVE }}
          path: objective-sdk-ios
      - name: Commit and push to SPM repo
        run: |
          cd objective-sdk-ios
          cp ../objective-sdk-kotlin-multiplatform/Package.swift Package.swift
          git config user.name hbmartin[bot]
          git config user.email harold.martin@gmail.com
          git add Package.swift
          git commit -m "Update objective-sdk-ios to ${{ github.event.release.tag_name }}"
          git push origin head
          git tag -a ${{ github.event.release.tag_name }} -m "Update objective-sdk-ios to ${{ github.event.release.tag_name }}"
          git push origin ${{ github.event.release.tag_name }}